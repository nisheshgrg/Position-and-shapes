<!DOCTYPE html>

<html>
	<head>
		<title>Positions and Shapes</title>
		<meta charset="utf-8"/>

		<style>
			body {
				background: #61bd8c;
				
			}

			#position-shape {
				background: #FFFFFF;
				padding:10px;
				width: 600px;
				margin-left: 30px 20px;
			}

			.container {
				background: #1e6f44;
				width: 100px;
				height: 100px;
				color: #FFFFFF;
				background-image: url("girl-saying-hello-cartoon-style-vector-illustration_1116403-1407.avif");
				background-repeat: no-repeat;
				background-size: cover;
			}

			#relative {
				position: relative;
				left: 0;
				top: 0;
			}
		</style>
	</head>
	

	<body>
		<div id="position-shape">
			<h1>Position and Shapes</h1>

			<h4>Relative</h4>
			<div id="relative" class="container">Relative</div>

			<h4>Absolute</h4>
			<div class="container">Absolute</div>

			<h4>Fixed</h4>
			<div class="container">Fixed</div>
		</div>
	</body>
</html>
